[project]
name = "youtube-listen-fill-backend"
version = "0.1.0"
description = "YouTube 英文聽打練習後端 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
